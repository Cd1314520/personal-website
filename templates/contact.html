{% extends "base.html" %}

{% block title %}Contact | Qizan Dong (Chris){% endblock %}

{% block content %}
<section class="section" id="contact">
    <div class="container">

        <!-- Section Header -->
        <div class="section-header fade-in">
            <span class="section-label">// Contact</span>
            <h1 class="section-title">Get In <span class="gradient-text">Touch</span></h1>
            <p class="section-subtitle">Have a question, opportunity, or just want to say hello? I'd love to hear from you.</p>
        </div>

        <!-- Contact Grid -->
        <div class="contact-grid">

            <!-- Contact Form -->
            <div class="contact-form-wrapper fade-in">
                <form id="contact-form">
                    <div class="form-group">
                        <label class="form-label" for="name">Full Name *</label>
                        <input type="text" class="form-input" id="name" name="name" placeholder="Your name" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Email Address *</label>
                        <input type="email" class="form-input" id="email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="subject">Subject</label>
                        <input type="text" class="form-input" id="subject" name="subject" placeholder="What's this about?">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="message">Message *</label>
                        <textarea class="form-textarea" id="message" name="message" placeholder="Tell me about your project, idea, or opportunity..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary form-submit" id="contact-submit-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        Send Message
                    </button>
                </form>
            </div>

            <!-- Contact Info -->
            <div class="contact-info-wrapper fade-in">

                <div class="contact-card">
                    <div class="contact-card-icon contact-card-icon--cyan">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    </div>
                    <div>
                        <h4>Email</h4>
                        <p><a href="mailto:dongqizan@gmail.com">dongqizan@gmail.com</a></p>
                    </div>
                </div>

                <div class="contact-card">
                    <div class="contact-card-icon contact-card-icon--violet">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    </div>
                    <div>
                        <h4>Location</h4>
                        <p>Houston, TX</p>
                    </div>
                </div>

                <!-- Social Links -->
                <div class="social-links-section">
                    <h4>Connect With Me</h4>
                    <div class="social-links">
                        <a href="https://github.com/cd1314520" target="_blank" rel="noopener" class="social-link" aria-label="GitHub" id="social-github">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
                        </a>
                        <a href="https://linkedin.com/in/chrisdong0425" target="_blank" rel="noopener" class="social-link" aria-label="LinkedIn" id="social-linkedin">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
                        </a>
                        <a href="mailto:dongqizan@gmail.com" class="social-link" aria-label="Email" id="social-email">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </a>
                    </div>
                </div>

            </div>
        </div>

    </div>
</section>
{% endblock %}
